minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push", "post-commit"]

[priorities]
format = 0
checks = 10
tests = 20

[[repos]]
repo = "local"

[[repos.hooks]]
id = "fmt"
name = "just fmt"
language = "system"
entry = "just fmt"
pass_filenames = false
always_run = true
priority = "format"
stages = ["pre-commit"]

[[repos.hooks]]
id = "clippy"
name = "just clippy"
language = "system"
entry = "just clippy"
pass_filenames = false
always_run = true
priority = "checks"
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint"
name = "just lint"
language = "system"
entry = "just lint"
pass_filenames = false
always_run = true
priority = "checks"
stages = ["pre-commit"]

[[repos.hooks]]
id = "test"
name = "just test"
language = "system"
entry = "just test"
pass_filenames = false
always_run = true
priority = "tests"
stages = ["pre-push"]

# Keep ~/.cargo/bin in step with the checkout, so the installed binary never
# runs older code than what was just committed.
[[repos.hooks]]
id = "install"
name = "just install"
language = "system"
entry = "just install"
pass_filenames = false
always_run = true
stages = ["post-commit"]
