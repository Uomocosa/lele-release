[package]
name = "lele-release"
version = "0.0.14"
edition = "2024"
rust-version = "1.98"
description = "Release orchestrator for the lele multi-repo fleet: tag pins in commits, sibling paths in the working tree"
license = "MIT"

[[bin]]
name = "lele-release"
path = "src/main.rs"

[dependencies]
atomic-delegate-macros = { git = "https://github.com/Uomocosa/lele-rust-linter", tag = "v0.0.14" }
clap = { version = "=4.6.7", features = ["derive"] }
pathdiff = "=0.2.3"
semver = "=1.0.28"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml_edit = "=0.22.27"

[dev-dependencies]
tempfile = "=3.27.0"
rstest = "=0.28.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
module_inception = "allow"
missing_errors_doc = "allow"
